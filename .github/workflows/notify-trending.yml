name: Notify Trending Story

# Twice a day: picks the most-discussed story of the last 24h and notifies
# every approved user, if it clears a minimum activity bar and hasn't been
# picked again too recently — see src/lib/articles/trending-notifications.ts.
# Runs on GitHub Actions rather than Vercel cron for the same reason as
# check-trends.yml (Vercel Hobby plan only supports daily frequency).
on:
  schedule:
    - cron: "40 12,19 * * *"
  workflow_dispatch: {}

jobs:
  notify-trending:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run notify-trending
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
