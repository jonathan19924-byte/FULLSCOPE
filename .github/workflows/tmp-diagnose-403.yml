name: TMP Diagnose 403s
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check runner clock vs real time
        run: |
          echo "Runner UTC time: $(date -u)"
          echo "Google's reported time (external reference):"
          curl -sI https://www.google.com | grep -i ^date

      - name: Test each URL with current bot User-Agent
        run: |
          BOT_UA="FullScopeRSSBot/1.0 (+https://fullscope-eight.vercel.app)"
          for entry in \
            "Times of Israel|https://www.timesofisrael.com/feed/" \
            "Now 14|https://www.c14.co.il/feed/" \
            "Kol Ha'ir|https://www.kolhair.co.il/feed/" \
            "Israel Defense|https://www.israeldefense.co.il/rss.xml" \
            "Ynet|https://www.ynet.co.il/Integration/StoryRss2.xml" \
            "Davar|https://www.davar1.co.il/feed/" \
            "Geektime|https://www.geektime.co.il/feed/" \
            "Local Call|https://www.mekomit.co.il/feed/"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            echo "=== $name (bot UA) ==="
            curl -s -o /tmp/resp.txt -w "HTTP %{http_code}\n" -A "$BOT_UA" "$url" --max-time 15
            head -c 300 /tmp/resp.txt; echo
            echo "--- headers ---"
            curl -sI -A "$BOT_UA" "$url" --max-time 15 | grep -iE "^HTTP|^server|^cf-ray|^cf-mitigated|^date"
            echo
          done

      - name: Test each URL with a real browser User-Agent
        run: |
          BROWSER_UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          for entry in \
            "Times of Israel|https://www.timesofisrael.com/feed/" \
            "Now 14|https://www.c14.co.il/feed/" \
            "Kol Ha'ir|https://www.kolhair.co.il/feed/" \
            "Israel Defense|https://www.israeldefense.co.il/rss.xml"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            echo "=== $name (browser UA) ==="
            curl -s -o /tmp/resp.txt -w "HTTP %{http_code}\n" -A "$BROWSER_UA" "$url" --max-time 15
            head -c 300 /tmp/resp.txt; echo
            echo "--- headers ---"
            curl -sI -A "$BROWSER_UA" "$url" --max-time 15 | grep -iE "^HTTP|^server|^cf-ray|^cf-mitigated|^date"
            echo
          done

      - name: Repeat Ynet/Davar/Geektime/Local Call 5x to try to catch the intermittent failure
        run: |
          BOT_UA="FullScopeRSSBot/1.0 (+https://fullscope-eight.vercel.app)"
          for i in 1 2 3 4 5; do
            echo "--- attempt $i ---"
            for entry in \
              "Ynet|https://www.ynet.co.il/Integration/StoryRss2.xml" \
              "Davar|https://www.davar1.co.il/feed/" \
              "Geektime|https://www.geektime.co.il/feed/" \
              "Local Call|https://www.mekomit.co.il/feed/"; do
              name="${entry%%|*}"
              url="${entry#*|}"
              code=$(curl -s -o /dev/null -w "%{http_code}" -A "$BOT_UA" "$url" --max-time 15)
              echo "$name: HTTP $code"
            done
          done
